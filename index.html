<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="description" content="Glass Symphony - shatter glass, play music. One finger, endless combos.">
<title>Glass Symphony</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07060f; color: #fff;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;

    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe {
    position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .btn {
    position: fixed; z-index: 2; border: 1px solid rgba(255,255,255,.22); color: #fff;
    background: rgba(255,255,255,.07); font: 700 15px/1 inherit; font-family: inherit;
    touch-action: manipulation; cursor: pointer; outline: none;
    transition: transform .12s ease, background .2s ease, opacity .25s ease;

    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #mute svg { width: 22px; height: 22px; }
  #share {
    left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px);
    transform: translateX(-50%); padding: 13px 26px; border-radius: 999px;
    letter-spacing: .04em; opacity: 0; pointer-events: none;
  }
  #share.on { opacity: 1; pointer-events: auto; }
  #share:active { transform: translateX(-50%) scale(.92); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="mute" class="btn" aria-label="Sound on/off"></button>
<button id="share" class="btn"></button>
<script>
(function () {
'use strict';

/* =========================================================
   GLASS SYMPHONY
   One-finger glass-shattering arcade game.
   Every shard is a note: combos climb the pentatonic scale.
   ========================================================= */

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const FONT = '"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif';
const TEST = /[?&]test\b/.test(location.search);

/* ---------- persistent save ---------- */
const SAVE_KEY = 'glassSymphony.v1';
const save = { best: 0, total: 0, games: 0, seenObs: false, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- language ---------- */
const LANG = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
const FI = LANG.indexOf('fi') === 0;
const L = FI ? {
  tap: 'NAPAUTA', hint1: 'Napauta tai pyyhkäise lasia ennen kuin se osuu maahan',
  hint2: 'Älä koske mustaan lasiin', best: 'Ennätys', newBest: 'UUSI ENNÄTYS!',
  toBeat: n => 'Vain ' + n + ' pistettä ennätykseen!', over: 'SINFONIA PÄÄTTYI',
  again: 'Napauta pelataksesi uudelleen', level: 'TASO', chain: 'KETJU', combo: 'KOMBO',
  fever: 'SINFONIA!', feverSub: 'Pisteet ×2', slow: 'HIDASTUS', prism: 'PRISMA!', life: '+1 ♥',
  maxCombo: 'Paras kombo', shattered: 'Rikottu', rank: 'Arvo', next: 'Seuraava',
  share: 'Jaa tulos', copied: 'Kopioitu!', paused: 'TAUKO', resume: 'Napauta jatkaaksesi',
  obsWarn: 'MUSTA LASI = −1 ♥', lastLife: 'VIIMEINEN ELÄMÄ!', top: 'HUIPPU',
  ranks: ['Aloittelija', 'Lasinpuhaltaja', 'Kristallisti', 'Virtuoosi', 'Maestro', 'Legenda'],
  shareText: n => 'Sain ' + n + ' pistettä Glass Symphonyssa! Pystytkö parempaan?'
} : {
  tap: 'TAP', hint1: 'Tap or swipe the glass before it hits the ground',
  hint2: 'Never touch the black glass', best: 'Best', newBest: 'NEW BEST!',
  toBeat: n => 'Only ' + n + ' points to beat your best!', over: 'SYMPHONY OVER',
  again: 'Tap to play again', level: 'LEVEL', chain: 'CHAIN', combo: 'COMBO',
  fever: 'SYMPHONY!', feverSub: 'Points ×2', slow: 'SLOW-MO', prism: 'PRISM!', life: '+1 ♥',
  maxCombo: 'Best combo', shattered: 'Shattered', rank: 'Rank', next: 'Next',
  share: 'Share score', copied: 'Copied!', paused: 'PAUSED', resume: 'Tap to continue',
  obsWarn: 'BLACK GLASS = −1 ♥', lastLife: 'LAST LIFE!', top: 'TOP',
  ranks: ['Novice', 'Glassblower', 'Crystalist', 'Virtuoso', 'Maestro', 'Legend'],
  shareText: n => 'I scored ' + n + ' in Glass Symphony! Can you beat it?'
};
document.documentElement.lang = FI ? 'fi' : 'en';
const RANK_AT = [0, 500, 1500, 4000, 8000, 15000];
function rankIndex(s) { let i = 0; while (i + 1 < RANK_AT.length && s >= RANK_AT[i + 1]) i++; return i; }

/* =========================================================
   AUDIO - everything synthesized with the Web Audio API
   ========================================================= */
const SFX = (function () {
  let ac = null, master, wet, noiseBuf;
  let muted = !!save.muted;
  const recent = [];
  const RATIOS = [1, 2.32, 4.25, 6.63]; // inharmonic partials = glassy ring

  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ac = new AC(); } catch (e2) { return; } }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.16;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
    master.connect(comp); comp.connect(ac.destination);
    // generated reverb: decaying stereo noise impulse
    const len = Math.floor(ac.sampleRate * 2.2);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4);
    }
    const conv = ac.createConvolver(); conv.buffer = ir;
    wet = ac.createGain(); wet.gain.value = 0.34;
    wet.connect(conv); conv.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // iOS unlock
    const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
    s.buffer = b; s.connect(ac.destination); s.start(0);
    if (ac.state !== 'running') ac.resume().catch(() => {});
  }
  function ok() { return ac && !muted && ac.state === 'running'; }
  function bus(pan, wetAmt) {
    const g = ac.createGain(); let node = g;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); node = p; }
    node.connect(master);
    if (wetAmt > 0) { const w = ac.createGain(); w.gain.value = wetAmt; node.connect(w); w.connect(wet); }
    return g;
  }
  function env(param, t, peak, a, d) {
    param.setValueAtTime(0.0001, t);
    param.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    param.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(dest, type, f, t, peak, a, d, fEnd) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + a + d);
    env(g.gain, t, peak, a, d);

  }
  function noise(dest, t, peak, d, ftype, f, q, fEnd) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; fl.type = ftype; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, t + d);
    env(g.gain, t, peak, 0.002, d);
    s.connect(fl); fl.connect(g); g.connect(dest);
    s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
  }
  function load() { // voice limiter: how many sounds in the last 120 ms
    const now = ac.currentTime;
    while (recent.length && now - recent[0] > 0.12) recent.shift();
    recent.push(now);
    return recent.length;
  }
  return {
    init,
    get muted() { return muted; },
    setMuted(m) {
      muted = m; save.muted = m; persist();
      if (ac) master.gain.setTargetAtTime(m ? 0 : 0.85, ac.currentTime, 0.02);
    },
    suspend() { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); },
    shatter(freq, size, pan, quiet) {
      if (!ok()) return;
      const n = load(); const lite = n > 4; const t = ac.currentTime + 0.004;
      const v = (quiet ? 0.45 : 1) * (lite ? 0.6 : 1);
      const b = bus(pan, 0.5);
      noise(b, t, 0.34 * v * (0.75 + size * 0.5), 0.08 + size * 0.13, 'highpass', rand(2500, 4200), 0.8);
      if (!lite) noise(b, t, 0.16 * v, 0.05, 'bandpass', rand(5200, 8200), 2.2);
      if (size > 0.45 && !lite) tone(b, 'sine', 170, t, 0.3 * size * v, 0.003, 0.12, 48);
      const k = lite ? 2 : 4 + Math.round(size * 3);
      for (let i = 0; i < k; i++) {
        const f = Math.min(freq * RATIOS[i % 4] * (i >= 4 ? rand(1.3, 2.1) : 1) * rand(0.985, 1.015), 14000);
        tone(b, 'sine', f, t + (i ? rand(0.006, 0.17) : 0), 0.06 * v / (1 + i * 0.3), 0.002, rand(0.12, 0.45));
      }
      tone(b, 'triangle', freq, t, 0.15 * v, 0.004, 0.9);   // the musical note
      tone(b, 'sine', freq * 2, t, 0.045 * v, 0.004, 0.6);
    },
    crack(freq, pan) {
      if (!ok()) return; load();
      const t = ac.currentTime + 0.004, b = bus(pan, 0.4);
      noise(b, t, 0.28, 0.045, 'highpass', 3600, 1);
      tone(b, 'sine', freq * 2.32, t, 0.09, 0.001, 0.25);
      tone(b, 'triangle', freq, t, 0.1, 0.003, 0.4);
    },
    miss(pan) {
      if (!ok()) return; load();
      const t = ac.currentTime + 0.004, b = bus(pan, 0.35);
      noise(b, t, 0.38, 0.28, 'highpass', 1700, 0.7);
      noise(b, t, 0.4, 0.2, 'lowpass', 900, 0.8, 150);
      tone(b, 'sine', 150, t, 0.5, 0.003, 0.28, 38);
      tone(b, 'triangle', 466.2, t + 0.02, 0.07, 0.005, 0.5);
      tone(b, 'triangle', 659.3, t + 0.02, 0.07, 0.005, 0.5);
    },
    hurt(pan) {
      if (!ok()) return; load();
      const t = ac.currentTime + 0.004, b = bus(pan, 0.3);
      tone(b, 'sawtooth', 110, t, 0.22, 0.005, 0.4, 52);
      tone(b, 'square', 116.5, t, 0.1, 0.005, 0.35, 55);
      noise(b, t, 0.42, 0.26, 'lowpass', 1600, 0.8, 180);
      noise(b, t, 0.2, 0.1, 'highpass', 3000, 0.8);
    },
    whoosh(k) {
      if (!ok()) return;
      const t = ac.currentTime + 0.002;
      noise(bus(0, 0), t, 0.03 + 0.05 * k, 0.15, 'bandpass', 500, 1.3, 2600);
    },
    arp(freqs, gap, peak, type) {
      if (!ok()) return;
      const t = ac.currentTime + 0.01, b = bus(0, 0.6);
      freqs.forEach((f, i) => { tone(b, type || 'triangle', f, t + i * gap, peak, 0.005, 0.7); tone(b, 'sine', f * 2, t + i * gap, peak * 0.3, 0.005, 0.5); });
    },
    power() {
      if (!ok()) return;
      const t = ac.currentTime + 0.01, b = bus(0, 0.8);
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(b, 'sine', f, t + i * 0.03, 0.09, 0.03, 1.6));
      noise(b, t, 0.12, 0.6, 'bandpass', 1200, 1.5, 9000);
    },
    gameOver() {
      if (!ok()) return;
      const t = ac.currentTime + 0.01, b = bus(0, 0.8);
      [783.99, 659.25, 523.25, 392.0, 261.63].forEach((f, i) => tone(b, 'triangle', f, t + i * 0.16, 0.13, 0.01, 1.1));
    }
  };
})();

/* =========================================================
   CANVAS / LAYOUT
   ========================================================= */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1, dprCap = 2, S = 1, R = 40, FX = 0, FW = 0, floorY = 0;
let safeT = 0, safeB = 0, quality = 1;
let vigDark, vigRed, vigGold, glowSprite;

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function vignette(rgb, inner, edgeA) {
  const w = Math.ceil(W / 2), h = Math.ceil(H / 2), c = makeCanvas(w, h), g = c.getContext('2d');
  const gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * inner, w / 2, h / 2, Math.hypot(w, h) / 2);
  gr.addColorStop(0, 'rgba(' + rgb + ',0)'); gr.addColorStop(1, 'rgba(' + rgb + ',' + edgeA + ')');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  return c;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  S = Math.min(W, H);
  FW = Math.min(W, H * 0.95); FX = (W - FW) / 2;
  R = clamp(Math.min(FW * 0.105, H * 0.068), 26, 62);
  const cs = getComputedStyle(document.getElementById('safe'));
  safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
  floorY = H - safeB - 4;
  vigDark = vignette('0,0,0', 0.35, 0.75);
  vigRed = vignette('255,20,60', 0.25, 0.9);
  vigGold = vignette('255,200,80', 0.3, 0.7);
  for (const o of objs) { o.x = clamp(o.x, FX + o.r * 0.6, FX + FW - o.r * 0.6); if (o.type === START) { o.x = W / 2; } }
  if (startPane) { startPane.y = H * 0.56; }
  initDust();
}
glowSprite = (function () {
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return c;
})();

/* =========================================================
   GAME STATE
   ========================================================= */
const GLASS = 0, TEMPERED = 1, GOLD = 2, OBSIDIAN = 3, PRISM = 4, HEART = 5, START = 6;
const BASE_PTS = [10, 30, 50, 0, 40, 20, 0];
const COMBO_WIN = 1.5;
const objs = [], timers = [];
let state = 'title', paused = false;
let score = 0, shownScore = 0, lives = 3, combo = 0, comboT = 0, maxCombo = 0, broken = 0;
let elapsed = 0, level = 1, spawnT = 0, feverT = 0, nextFever = 25, slowT = 0;
let hitStop = 0, trauma = 0, redFlash = 0, goldFlash = 0, stateT = 0, scorePop = 0;
let newBest = false, bestShown = false, levelHue = 195, bgHue = 235, lastSpawnX = -999, strokeId = 0;
let runBest = 0, startPane = null, obsHintShown = !!save.seenObs, lastLifeShown = false;
let banner = null, prevBest = 0;

/* ---------- effect pools ---------- */
const shards = [], sparks = [], texts = [], rings = [], flashes = [], cracks = [], trail = [], dust = [];
const shardFree = [], sparkFree = [];
const maxShards = () => Math.floor(420 * quality);
const maxSparks = () => Math.floor(460 * quality);

function initDust() {
  dust.length = 0;
  const n = Math.round(clamp(W * H / 22000, 25, 70));
  for (let i = 0; i < n; i++) dust.push({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1), p: rand(0, TAU) });
}

/* =========================================================
   GLASS OBJECTS
   ========================================================= */
function shape(type, r) {
  const p = [];
  if (type === OBSIDIAN) {
    const n = 7, off = rand(0, TAU);
    for (let i = 0; i < n * 2; i++) {
      const a = off + i * Math.PI / n + rand(-0.07, 0.07), rr = (i % 2 ? 0.52 : 1) * r * rand(0.9, 1.04);
      p.push(Math.cos(a) * rr, Math.sin(a) * rr);
    }
  } else if (type === HEART) {
    const pts = [];
    for (let i = 0; i < 18; i++) {
      const t = i / 18 * TAU;
      pts.push(16 * Math.pow(Math.sin(t), 3), -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)));
    }
    let minY = 1e9, maxY = -1e9;
    for (let i = 1; i < pts.length; i += 2) { minY = Math.min(minY, pts[i]); maxY = Math.max(maxY, pts[i]); }
    const cy = (minY + maxY) / 2, k = r / 16.5;
    for (let i = 0; i < pts.length; i += 2) p.push(pts[i] * k, (pts[i + 1] - cy) * k);
  } else if (type === PRISM) {
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 6; p.push(Math.cos(a) * r, Math.sin(a) * r); }
  } else if (type === GOLD) {
    const n = 8;
    for (let i = 0; i < n; i++) { const a = i * TAU / n; const rr = (i % 2 ? 0.72 : 1) * r; p.push(Math.cos(a) * rr, Math.sin(a) * rr); }
  } else if (type === START) {
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; p.push(Math.cos(a) * r, Math.sin(a) * r); }
  } else {
    const n = type === TEMPERED ? randi(5, 6) : randi(3, 7), off = rand(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = off + i * TAU / n + rand(-0.32, 0.32) * (TAU / n) * 0.5, rr = r * rand(0.82, 1.04);
      p.push(Math.cos(a) * rr, Math.sin(a) * rr);
    }

}
function styleGlass(o) {
  const h = o.hue;
  switch (o.type) {
    case TEMPERED:
      o.fill = 'hsla(' + h + ',75%,62%,0.30)'; o.edge = 'hsla(' + h + ',100%,82%,1)';
      o.bevel = 'hsla(' + h + ',100%,95%,0.65)'; o.lw = 4; break;
    case GOLD:
      o.fill = 'hsla(45,100%,58%,0.42)'; o.edge = 'hsla(48,100%,76%,1)'; o.bevel = 'hsla(50,100%,92%,0.7)'; o.lw = 3; break;
    case OBSIDIAN:
      o.fill = 'rgba(12,6,22,0.93)'; o.edge = 'hsla(285,85%,58%,0.95)'; o.bevel = 'hsla(300,90%,72%,0.3)'; o.lw = 2.2; break;
    case PRISM:
      o.fill = 'rgba(255,255,255,0.16)'; o.edge = '#fff'; o.bevel = 'rgba(255,255,255,0.5)'; o.lw = 3.2; break;
    case HEART:
      o.fill = 'hsla(340,95%,64%,0.40)'; o.edge = 'hsla(340,100%,84%,1)'; o.bevel = 'hsla(340,100%,93%,0.6)'; o.lw = 3; break;
    case START:
      o.fill = 'hsla(' + h + ',90%,65%,0.16)'; o.edge = 'hsla(' + h + ',100%,86%,1)'; o.bevel = 'hsla(' + h + ',100%,93%,0.45)'; o.lw = 3.5; break;
    default:
      o.fill = 'hsla(' + h + ',95%,70%,0.26)'; o.edge = 'hsla(' + h + ',100%,86%,1)'; o.bevel = 'hsla(' + h + ',100%,93%,0.42)'; o.lw = 2.4;
  }
}
function createGlass(type, x, y, vy) {
  let r;
  if (type === START) r = S * 0.16;
  else if (type === TEMPERED) r = R * 1.2;
  else if (type === GOLD || type === HEART) r = R * 0.86;
  else if (type === PRISM) r = R * 0.95;
  else if (type === OBSIDIAN) r = R * rand(0.95, 1.1);

    type, x, y, vx: rand(-0.025, 0.025) * S, vy: vy || 0, rot: rand(0, TAU), vr: rand(-1.3, 1.3),
    r, pts: shape(type, r), hue, hp: type === TEMPERED ? 2 : 1,
    swayA: (level >= 3 && type !== START && Math.random() < 0.3) ? rand(0.4, 0.9) * R : 0,

/* =========================================================

/* =========================================================
   UPDATE
   ========================================================= */
function update(rdt) {
  // hit-stop freezes the world for a few frames: the "impact" feel
  let ts = 1;
  if (hitStop > 0) { hitStop -= rdt; ts = 0.06; }
  if (state === 'dying') ts *= 0.4;
  const dt = rdt * ts;
  stateT += rdt;

  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i]; tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }

  if (state === 'play') {
    elapsed += dt;
    const nl = levelFor(elapsed);
    if (nl !== level) {
      level = nl; levelHue = levelHueFor(level);
      showBanner(L.level + ' ' + level, '', 'hsl(' + levelHue + ',100%,78%)', 1.4);
      SFX.arp([noteFreq(0), noteFreq(2), noteFreq(4), noteFreq(5)], 0.08, 0.09);
    }
    spawnT -= dt * (slowT > 0 ? 0.5 : 1);
    if (spawnT <= 0) { spawn(); spawnT = spawnGap() * rand(0.8, 1.2); }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (feverT > 0) feverT -= dt;
    if (slowT > 0) slowT -= dt;
  }

  // objects
  const f = slowT > 0 ? 0.42 : 1, grav = H * 0.03;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (o.dead) { objs.splice(i, 1); continue; }
    o.t += dt;
    if (o.type === START) { o.rot += o.vr * dt; o.y = H * 0.56 + Math.sin(o.t * 1.6) * S * 0.012; continue; }
    if (state === 'dying') continue;
    o.vy += grav * dt * f;
    o.x += (o.vx + Math.cos(o.t * o.swayF + o.ph) * o.swayA * o.swayF) * dt * f;
    o.y += o.vy * dt * f;
    o.rot += o.vr * dt * f;
    const lo = FX + o.r * 0.6, hi = FX + FW - o.r * 0.6;
    if (o.x < lo) { o.x = lo; o.vx = Math.abs(o.vx); } else if (o.x > hi) { o.x = hi; o.vx = -Math.abs(o.vx); }
    if (o.type === GOLD && Math.random() < dt * 14) addSpark(o.x + rand(-o.r, o.r), o.y + rand(-o.r, o.r), 0, -S * 0.05, '#ffe9a0', 1.6, 0.5);
    if (state === 'play' && o.y > floorY - o.r * 0.35) hitFloor(o);
  }

  // shards
  const G = H * 1.7;
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.vy += G * dt; s.vx *= 1 - 0.5 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    if (s.y > floorY && s.vy > 0) { s.y = floorY; s.vy *= -0.32; s.vx *= 0.6; s.vr *= 0.5; }
    s.life -= dt;
    if (s.life <= 0 || s.x < -80 || s.x > W + 80) { shardFree.push(s); shards[i] = shards[shards.length - 1]; shards.pop(); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.vy += G * 0.45 * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.0 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { sparkFree.push(p); sparks[i] = sparks[sparks.length - 1]; sparks.pop(); }
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= rdt; t.y += t.vy * rdt; t.vy *= 1 - 2 * rdt; if (t.life <= 0) texts.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt; r.r += r.vr * dt * (r.life / r.max + 0.2); if (r.life <= 0) rings.splice(i, 1); }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].life -= dt; if (flashes[i].life <= 0) flashes.splice(i, 1); }
  for (let i = cracks.length - 1; i >= 0; i--) { cracks[i].life -= dt; if (cracks[i].life <= 0) cracks.splice(i, 1); }
  for (let i = trail.length - 1; i >= 0; i--) { trail[i].t += rdt; }
  while (trail.length && trail[0].t > 0.14) trail.shift();
  for (const d of dust) { d.y -= S * 0.012 * d.z * rdt; if (d.y < -4) { d.y = H + 4; d.x = rand(0, W); } }

  if (banner) { banner.life -= rdt; if (banner.life <= 0) banner = null; }
  trauma = Math.max(0, trauma - rdt * 1.9);
  redFlash = Math.max(0, redFlash - rdt * 2.2);
  goldFlash = Math.max(0, goldFlash - rdt * 1.4);
  scorePop = Math.max(0, scorePop - rdt * 5);
  shownScore += (score - shownScore) * Math.min(1, rdt * 14);
  if (Math.abs(score - shownScore) < 0.5) shownScore = score;
  const targetBg = feverT > 0 ? (bgHue + rdt * 90) : 225 + ((level - 1) % 4) * 20;
  bgHue = feverT > 0 ? targetBg % 360 : bgHue + (((targetBg - bgHue + 540) % 360) - 180) * Math.min(1, rdt * 1.5);

  if (state === 'dying' && stateT > 1.6) finishGame();
}

/* =========================================================
   RENDER
   ========================================================= */
function txt(str, x, y, size, col, opts) {
  opts = opts || {};
  ctx.font = (opts.w || 800) + ' ' + Math.round(size) + 'px ' + FONT;
  const fit = opts.fit === undefined ? W - 28 : opts.fit;
  if (fit) { const w = ctx.measureText(str).width; if (w > fit) { size *= fit / w; ctx.font = (opts.w || 800) + ' ' + Math.round(size) + 'px ' + FONT; } }
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  if (opts.outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.14); ctx.strokeStyle = opts.outline; ctx.strokeText(str, x, y); }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function polyPath(p, k) {
  ctx.beginPath(); ctx.moveTo(p[0] * k, p[1] * k);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * k, p[i + 1] * k);
  ctx.closePath();
}
function drawGlass(o, sx, sy, now) {
  const c = Math.cos(o.rot), s = Math.sin(o.rot);
  ctx.setTransform(DPR * c, DPR * s, -DPR * s, DPR * c, DPR * (o.x + sx), DPR * (o.y + sy));
  const fever = feverT > 0 && o.type === GLASS;
  polyPath(o.pts, 1);
  ctx.fillStyle = o.fill; ctx.fill();
  ctx.lineJoin = 'round';
  if (o.type === PRISM) {
    const p = o.pts, n = p.length >> 1;
    ctx.lineWidth = o.lw;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      ctx.strokeStyle = 'hsl(' + ((now * 0.25 + i * 60) % 360) + ',100%,72%)';
      ctx.beginPath(); ctx.moveTo(p[i * 2], p[i * 2 + 1]); ctx.lineTo(p[j * 2], p[j * 2 + 1]); ctx.stroke();
    }

  }
  // danger pulse near the floor
  if (state === 'play' && (o.type === GLASS || o.type === TEMPERED) && o.y > H * 0.7) {
    const k = clamp((o.y - H * 0.7) / (floorY - H * 0.7), 0, 1);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,60,90,' + (k * (0.55 + 0.45 * Math.sin(now * 0.025))) + ')'; ctx.stroke();
  }
  polyPath(o.pts, 0.78); ctx.lineWidth = 1.2; ctx.strokeStyle = o.bevel; ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4; ctx.beginPath();
    for (let i = 0; i < o.crk.length; i += 6) { ctx.moveTo(o.crk[i], o.crk[i + 1]); ctx.lineTo(o.crk[i + 2], o.crk[i + 3]); ctx.lineTo(o.crk[i + 4], o.crk[i + 5]); }

  }

}

function render(now) {
  const sh = trauma * trauma * S * 0.035;
  const sx = sh ? rand(-sh, sh) : 0, sy = sh ? rand(-sh, sh) : 0;

  // background
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const sat = feverT > 0 ? 70 : 45;
  g.addColorStop(0, 'hsl(' + bgHue.toFixed(1) + ',' + sat + '%,11%)');
  g.addColorStop(1, 'hsl(' + ((bgHue + 50) % 360).toFixed(1) + ',' + (sat + 10) + '%,4%)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft overhead light
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.10 + (feverT > 0 ? 0.08 + 0.06 * Math.sin(now * 0.01) : 0);
  ctx.drawImage(glowSprite, W / 2 - S * 0.9, -S * 0.75, S * 1.8, S * 1.5);
  // dust
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(200,220,255,0.5)';
  for (const d of dust) {
    const a = 0.25 + 0.25 * Math.sin(now * 0.002 + d.p);
    ctx.globalAlpha = a * d.z; const z = 1 + d.z * 1.4;
    ctx.fillRect(d.x, d.y, z, z);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // play field edges on wide screens
  if (FX > 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, FX, H); ctx.fillRect(FX + FW, 0, W - FX - FW, H);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(FX - 1, 0, 1, H); ctx.fillRect(FX + FW, 0, 1, H);
  }
  // floor line
  if (state === 'play' || state === 'dying') {
    const fg = ctx.createLinearGradient(0, floorY - 30, 0, floorY);
    fg.addColorStop(0, 'rgba(255,255,255,0)'); fg.addColorStop(1, 'rgba(255,255,255,0.07)');
    ctx.fillStyle = fg; ctx.fillRect(FX, floorY - 30, FW, 30);

    const c = Math.cos(s.rot), n = Math.sin(s.rot), v = s.v;
    ctx.setTransform(DPR * c, DPR * n, -DPR * n, DPR * c, DPR * (s.x + sx), DPR * (s.y + sy));
    ctx.globalAlpha = s.life < 0.35 ? s.life / 0.35 : 1;
    ctx.beginPath(); ctx.moveTo(v[0], v[1]);
    for (let k = 1; k < s.n; k++) ctx.lineTo(v[k * 2], v[k * 2 + 1]);
    ctx.closePath();

  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const cr of cracks) {
    ctx.globalAlpha = cr.life / cr.max; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < cr.seg.length; i += 6) { ctx.moveTo(cr.seg[i], cr.seg[i + 1]); ctx.lineTo(cr.seg[i + 2], cr.seg[i + 3]); ctx.lineTo(cr.seg[i + 4], cr.seg[i + 5]); }

  }
  for (const p of sparks) {
    ctx.globalAlpha = p.life / p.max; ctx.strokeStyle = p.col; ctx.lineWidth = p.w;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
  }
  for (const fl of flashes) {
    const k = fl.life / fl.max; ctx.globalAlpha = k * 0.9; const r = fl.r * (1.2 - k * 0.4);
    ctx.drawImage(glowSprite, fl.x - r, fl.y - r, r * 2, r * 2);
  }
  for (const r of rings) {
    const k = r.life / r.max; ctx.globalAlpha = 1; ctx.strokeStyle = r.col + (k * 0.8).toFixed(3) + ')'; ctx.lineWidth = r.w * k + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  // finger trail
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    if (a.s !== b.s) continue;
    const k = 1 - b.t / 0.14;
    ctx.globalAlpha = k * 0.9; ctx.lineWidth = 2 + k * (R * 0.22);
    ctx.strokeStyle = feverT > 0 ? 'hsl(' + ((now * 0.3 + i * 12) % 360) + ',100%,75%)' : 'hsl(' + levelHue + ',100%,85%)';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  if (state === 'play' && lives === 1) { ctx.globalAlpha = 0.18 + 0.12 * Math.sin(now * 0.006); ctx.drawImage(vigRed, 0, 0, W, H); }
  if (goldFlash > 0 || feverT > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(goldFlash * 0.8, feverT > 0 ? 0.25 + 0.15 * Math.sin(now * 0.012) : 0);

  if (state === 'play' || state === 'dying') drawHUD(now);
  if (state === 'title') drawTitle(now);
  if (state === 'over') drawOver(now);

    const k = banner.life / banner.max, age = banner.max - banner.life;

    ctx.globalAlpha = Math.min(1, k * 3);
    const bs = clamp(S * 0.11, 34, 76) * sc;
    txt(banner.txt, W / 2, H * 0.44, bs, banner.col, { outline: 'rgba(0,0,0,0.5)', w: 900 });
    if (banner.sub) txt(banner.sub, W / 2, H * 0.44 + bs * 0.85, bs * 0.38, '#ffffff', { outline: 'rgba(0,0,0,0.5)' });
    ctx.globalAlpha = 1;
  }
  if (paused) {
    ctx.fillStyle = 'rgba(5,4,12,0.72)'; ctx.fillRect(0, 0, W, H);
    txt(L.paused, W / 2, H * 0.45, clamp(S * 0.1, 32, 64), '#fff', { w: 900 });
    txt(L.resume, W / 2, H * 0.53, clamp(S * 0.04, 15, 22), 'rgba(255,255,255,0.75)', { w: 600 });
  }
}

function drawLives(x, y, size) {
  for (let i = 0; i < 3; i++) {
    const cx = x + i * size * 1.25, on = i < lives;
    ctx.beginPath(); ctx.moveTo(cx, y - size * 0.5); ctx.lineTo(cx + size * 0.42, y); ctx.lineTo(cx, y + size * 0.5); ctx.lineTo(cx - size * 0.42, y); ctx.closePath();
    ctx.fillStyle = on ? 'rgba(255,120,160,0.55)' : 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = on ? '#ffc2d6' : 'rgba(255,255,255,0.2)'; ctx.stroke();
  }
}
function drawHUD(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = safeT + 14;
  // progress towards your best (the "almost there" hook)
  if (prevBest > 0) {
    const k = clamp(score / prevBest, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, safeT, W, 3);
    ctx.fillStyle = score > prevBest ? '#ffe27a' : 'hsl(' + levelHue + ',100%,75%)'; ctx.fillRect(0, safeT, W * k, 3);
  }
  const ss = clamp(S * 0.1, 34, 66) * (1 + scorePop * 0.18);
  txt(String(Math.round(shownScore)), W / 2, top + ss * 0.6, ss, '#fff', { w: 900, outline: 'rgba(0,0,0,0.35)' });
  const small = clamp(S * 0.034, 12, 18);
  if (prevBest > 0) txt(score > prevBest ? L.newBest : L.best + ' ' + prevBest, W / 2, top + ss * 1.25, small, score > prevBest ? '#ffe27a' : 'rgba(255,255,255,0.55)', { w: 700 });
  // combo multiplier with draining timer
  if (combo >= 2) {
    const mult = Math.min(8, 1 + Math.floor(combo / 5)) * (feverT > 0 ? 2 : 1);
    const cy = top + ss * 1.25 + small * 1.7;
    const hue = (combo * 9) % 360;
    txt('×' + mult + '  ·  ' + combo + ' ' + L.combo, W / 2, cy, small * 1.15, 'hsl(' + hue + ',100%,75%)', { w: 800 });
    const bw = clamp(S * 0.28, 90, 180), k = clamp(comboT / COMBO_WIN, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(W / 2 - bw / 2, cy + small * 0.9, bw, 3);
    ctx.fillStyle = 'hsl(' + hue + ',100%,70%)'; ctx.fillRect(W / 2 - bw / 2, cy + small * 0.9, bw * k, 3);
  }
  const ls = clamp(S * 0.045, 16, 24);
  drawLives(safeT ? 22 + ls * 0.4 : 18 + ls * 0.4, top + ls * 0.6, ls);
  txt(L.level + ' ' + level, 16, top + ls * 1.75, small * 0.85, 'rgba(255,255,255,0.5)', { align: 'left', w: 700 });
  if (feverT > 0) txt(L.fever, W - 16, top + 70, small, '#ffe27a', { align: 'right', w: 900 });
}

function drawTitle(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ts = clamp(S * 0.15, 44, 110);
  const y0 = Math.max(safeT + ts * 0.9, H * 0.17);
  const gr = ctx.createLinearGradient(W / 2 - ts * 2.5, 0, W / 2 + ts * 2.5, 0);
  const h = (now * 0.03) % 360;
  gr.addColorStop(0, 'hsl(' + h + ',100%,80%)'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, 'hsl(' + ((h + 120) % 360) + ',100%,80%)');
  txt('GLASS', W / 2, y0, ts, gr, { w: 900, outline: 'rgba(0,0,0,0.35)' });
  txt('SYMPHONY', W / 2, y0 + ts * 0.82, ts * 0.52, 'rgba(255,255,255,0.9)', { w: 300 });
  if (startPane && !startPane.dead) {
    const pulse = 1 + 0.06 * Math.sin(now * 0.006);
    txt(L.tap, startPane.x, startPane.y, clamp(S * 0.06, 20, 38) * pulse, '#ffffff', { w: 900, outline: 'rgba(0,0,0,0.3)', fit: startPane.r * 1.45 });
  }
  const hs = clamp(S * 0.036, 13, 19), hy = Math.min(H * 0.8, H - safeB - hs * 5.2);
  txt(L.hint1, W / 2, hy, hs, 'rgba(255,255,255,0.8)', { w: 600 });
  txt('⬢  ' + L.hint2, W / 2, hy + hs * 1.7, hs, '#c58bff', { w: 700 });
  if (save.best > 0) txt(L.best + ' ' + save.best + '   ·   ' + L.rank + ': ' + L.ranks[rankIndex(save.best)], W / 2, hy + hs * 3.6, hs * 0.95, '#ffe27a', { w: 700 });
}

function drawOver(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const a = clamp(stateT / 0.4, 0, 1);
  ctx.globalAlpha = a * 0.6; ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const u = clamp(S * 0.1, 30, 70);
  let y = Math.max(safeT + u * 0.9, H * 0.16);
  txt(L.over, W / 2, y, u * 0.48, 'rgba(255,255,255,0.75)', { w: 800 });
  y += u * 1.25;
  const pop = stateT < 0.5 ? 1 + (1 - stateT / 0.5) * 0.25 : 1;
  txt(String(score), W / 2, y, u * 1.6 * pop, newBest ? '#ffe27a' : '#ffffff', { w: 900, outline: 'rgba(0,0,0,0.4)' });
  y += u * 1.15;
  const s2 = u * 0.36;
  if (newBest && score > 0) {
    txt(L.newBest, W / 2, y, s2 * (1 + 0.08 * Math.sin(now * 0.01)), '#ffe27a', { w: 900 });
  } else {
    const gap = save.best - score;
    if (gap > 0 && gap <= Math.max(150, save.best * 0.3)) txt(L.toBeat(gap), W / 2, y, s2 * 0.9, '#ffb36b', { w: 800 });
    else txt(L.best + ' ' + save.best, W / 2, y, s2 * 0.9, 'rgba(255,255,255,0.7)', { w: 700 });
  }
  y += u * 0.75;
  txt(L.maxCombo + ' ' + maxCombo + '   ·   ' + L.shattered + ' ' + broken, W / 2, y, s2 * 0.75, 'rgba(255,255,255,0.6)', { w: 600 });
  // rank + progress to next rank (the long-term hook)
  y += u * 0.95;
  const ri = rankIndex(save.best);
  txt(L.rank + ': ' + L.ranks[ri], W / 2, y, s2 * 0.95, 'hsl(' + (190 + ri * 30) + ',100%,78%)', { w: 900 });
  y += u * 0.5;
  const bw = Math.min(W * 0.7, 320);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(W / 2 - bw / 2, y, bw, 6);
  if (ri + 1 < RANK_AT.length) {
    const k = clamp((save.best - RANK_AT[ri]) / (RANK_AT[ri + 1] - RANK_AT[ri]), 0, 1);
    ctx.fillStyle = 'hsl(' + (190 + ri * 30) + ',100%,70%)'; ctx.fillRect(W / 2 - bw / 2, y, bw * k, 6);
    txt(L.next + ': ' + L.ranks[ri + 1] + ' (' + RANK_AT[ri + 1] + ')', W / 2, y + u * 0.42, s2 * 0.7, 'rgba(255,255,255,0.55)', { w: 600 });
  } else {
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(W / 2 - bw / 2, y, bw, 6);
    txt(L.top, W / 2, y + u * 0.42, s2 * 0.7, '#ffe27a', { w: 800 });
  }
  if (stateT > 0.9) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now * 0.006);
    const ay = Math.min(H * 0.8, H - safeB - 100);
    txt(L.again, W / 2, ay, clamp(S * 0.05, 18, 28), '#ffffff', { w: 800 });
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   MAIN LOOP  (+ adaptive resolution to hold 60 FPS)
   ========================================================= */
let lastT = 0, perfAcc = 0, perfN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = lastT ? (now - lastT) / 1000 : 1 / 60;
  lastT = now;
  if (rdt > 0.05) rdt = 0.05; // tab hiccups never teleport glass through the floor
  if (!paused) update(rdt);
  render(now);
  if (state === 'play' && !paused) {
    perfAcc += rdt; perfN++;
    if (perfN >= 150) {
      const avg = perfAcc / perfN;
      if (avg > 0.022 && (dprCap > 1 || quality > 0.55)) {
        if (dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); resize(); } else quality = Math.max(0.55, quality - 0.2);
      }
      perfAcc = 0; perfN = 0;
    }
  }
}

resize();
toTitle();
requestAnimationFrame(frame);

// offline support: cache the game once, play anywhere without a connection
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !TEST) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

if (TEST) {
  window.GS = {
    get state() { return state; }, get score() { return score; }, get lives() { return lives; },
    get objs() { return objs; }, get shards() { return shards.length; }, get level() { return level; },
    setElapsed(t) { elapsed = t; },
    put(type, x, y) { const o = createGlass(type, x, y, 0); objs.push(o); return objs.length; },
    setCombo(c) { combo = c; comboT = COMBO_WIN; }
  };
}
})();
</script>
