<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Glass Symphony - shatter glass, play music. One finger, endless combos.">
<title>Glass Symphony</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07060f; color: #fff;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe {
    position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .btn {
    position: fixed; z-index: 2; border: 1px solid rgba(255,255,255,.22); color: #fff;
    background: rgba(255,255,255,.07); font-family: inherit; font-weight: 700; font-size: 15px; line-height: 1;
    touch-action: manipulation; cursor: pointer; outline: none;
    transition: transform .12s ease, background .2s ease, opacity .25s ease;
  }
  .btn:active { transform: scale(.92); background: rgba(255,255,255,.16); }
  #mute {
    top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 12px);
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #mute svg { width: 22px; height: 22px; }
  #share {
    left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px);
    transform: translateX(-50%); padding: 13px 26px; border-radius: 999px;
    letter-spacing: .04em; opacity: 0; pointer-events: none;
  }
  #share.on { opacity: 1; pointer-events: auto; }
  #share:active { transform: translateX(-50%) scale(.92); }
  [hidden] { display: none !important; }
  /* continue-for-an-ad button: only ever shown in the store app (window.GSAds) */
  #revive {
    left: 50%; top: 60%; transform: translateX(-50%); z-index: 3;
    padding: 14px 26px 13px; border-radius: 999px; text-align: center; white-space: nowrap;
    background: linear-gradient(180deg, rgba(255,226,122,.28), rgba(255,170,60,.18));
    border-color: rgba(255,226,122,.75); color: #fff3c4; font-weight: 900; font-size: 18px; letter-spacing: .03em;
    box-shadow: 0 0 24px rgba(255,200,90,.35); animation: gs-revive 1.4s ease-in-out infinite;
  }
  #revive small { display: block; font-weight: 600; font-size: 12px; opacity: .8; letter-spacing: .02em; margin-top: 2px; }
  #revive:active { transform: translateX(-50%) scale(.92); }
  #revive[disabled] { opacity: .55; animation: none; }
  @keyframes gs-revive { 0%, 100% { box-shadow: 0 0 18px rgba(255,200,90,.25); } 50% { box-shadow: 0 0 34px rgba(255,200,90,.6); } }
  @media (prefers-reduced-motion: reduce) { #revive { animation: none; } }

  /* ---------- crystals wallet + shop + daily reward ---------- */
  .gem { display: inline-block; width: 12px; height: 16px; flex: none;
    background: linear-gradient(160deg, #e9fdff 0%, #7fe8ff 45%, #3aa6d8 100%);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); filter: drop-shadow(0 0 4px rgba(127,232,255,.8)); }
  #wallet {
    top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 64px);
    height: 44px; padding: 0 14px 0 12px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 900; letter-spacing: .02em; color: #dffbff;
    border-color: rgba(127,232,255,.45); background: rgba(127,232,255,.10);
    opacity: 0; pointer-events: none;
  }
  #wallet.on { opacity: 1; pointer-events: auto; }
  #wallet .plus { margin-left: 2px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(90deg, #7fe8ff, #c58bff); color: #140d2c; font-size: 15px; line-height: 1; }
  #wallet.badge::after { content: ''; position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 50%;
    background: #ff5a7a; box-shadow: 0 0 0 2px #07060f; animation: gs-pulse 1.8s ease-in-out infinite; }
  #wallet.bump { animation: gs-bump .32s ease-out; }
  @keyframes gs-bump { 40% { transform: scale(1.16); } }

  .modal {
    position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; background: rgba(4,3,10,.78);
    padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    animation: gs-fade .18s ease-out;
  }
  .modal .panel {
    position: relative; width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; box-sizing: border-box;
    padding: 22px 16px 16px; border-radius: 22px; color: #fff; touch-action: pan-y; overscroll-behavior: contain;
    background: linear-gradient(160deg, rgba(40,32,82,.98), rgba(12,10,28,.98));
    border: 1px solid rgba(255,255,255,.16); box-shadow: 0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14);
    animation: gs-pop .24s cubic-bezier(.2,.9,.3,1.25);
  }
  .modal h2 { margin: 0 48px 4px 4px; font-size: 22px; font-weight: 900; letter-spacing: .02em; }
  .modal .close {
    position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff;
    font-family: inherit; font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .modal .bal { display: flex; align-items: center; gap: 8px; margin: 0 4px 14px; font-weight: 900; font-size: 18px; color: #dffbff; }
  .modal .cta {
    width: 100%; height: 52px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, #7fe8ff, #c58bff); color: #140d2c;
    font-family: inherit; font-weight: 900; font-size: 17px; line-height: 1; letter-spacing: .02em;
  }
  .modal button:active { transform: scale(.96); }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.06);
    overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1 0 auto; height: 38px; padding: 0 7px; border: 0; border-radius: 999px; background: none; color: rgba(255,255,255,.7);
    font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: rgba(255,255,255,.16); color: #fff; }
  .items { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 10px 10px 10px;
    border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
  .item.on { border-color: rgba(127,232,255,.7); background: rgba(127,232,255,.09); }
  .item.pop { animation: gs-bump .4s ease-out; }
  .item .pv { width: 56px; height: 56px; border-radius: 14px; position: relative; overflow: hidden; }
  .item .ball { width: 40px; height: 40px; border-radius: 50%; margin: 8px; }
  .item .dots { position: absolute; inset: auto 0 8px 0; display: flex; justify-content: center; gap: 4px; }
  .item .dots i { width: 9px; height: 13px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .item strong { display: block; font-size: 15px; font-weight: 800; }
  .item p { margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: rgba(255,255,255,.7); }
  .item .buy { min-width: 86px; height: 40px; padding: 0 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    border: 1px solid rgba(127,232,255,.55); background: rgba(127,232,255,.12); color: #e9fdff;
    font-family: inherit; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .item .buy.own { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; }
  .item .buy.used { border-color: transparent; background: none; color: #7fe8ff; cursor: default; }
  .item .buy.poor { opacity: .55; }
  .item .buy.money { border: 0; background: linear-gradient(90deg, #ffe27a, #ffb36b); color: #2a1800; }
  .item .acts { display: flex; flex-direction: column; gap: 6px; }
  .item .buy.tog { height: 30px; font-size: 12px; border-color: rgba(255,255,255,.25); background: none; color: rgba(255,255,255,.75); }
  .item .buy.tog.on { border-color: rgba(125,255,207,.7); background: rgba(125,255,207,.14); color: #dfffee; }
  .item .pv svg { position: absolute; inset: 8px; width: 40px; height: 40px; }
  .item .pv .cnt { position: absolute; right: 4px; bottom: 2px; font-size: 13px; font-weight: 900; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .item .buy[disabled] { opacity: .45; cursor: default; }
  .shake { animation: gs-shake .35s; }
  @keyframes gs-shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .modal .msg { min-height: 18px; margin: 12px 4px 0; font-size: 13px; color: #ffb36b; text-align: center; }
  .modal .note { margin: 12px 4px 0; font-size: 12px; color: rgba(255,255,255,.5); text-align: center; }
  .modal .link { display: block; margin: 8px auto 0; background: none; border: 0; color: rgba(255,255,255,.6);
    text-decoration: underline; font: inherit; font-size: 13px; padding: 6px; cursor: pointer; }
  #daily .sub { margin: 0 4px 16px; font-size: 14px; color: rgba(255,255,255,.72); }
  .days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .day { display: grid; justify-items: center; gap: 4px; padding: 10px 2px 9px; border-radius: 14px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); font-size: 12px; color: rgba(255,255,255,.6); }
  .day b { font-size: 15px; color: #fff; }
  .day.done { opacity: .5; }
  .day.today { border-color: #7fe8ff; background: rgba(127,232,255,.14); color: #dffbff; box-shadow: 0 0 18px rgba(127,232,255,.3); }
  .day.big { grid-column: span 2; }
  @media (prefers-reduced-motion: reduce) { .modal, .modal .panel, #wallet.badge::after, #wallet.bump, .item.pop, .shake { animation: none; } }

  /* ---------- leaderboards ---------- */
  #lbBtn {
    top: calc(env(safe-area-inset-top) + 64px); left: calc(env(safe-area-inset-left) + 12px);
    width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center;
    border-color: rgba(255,226,122,.45); background: rgba(255,226,122,.08); opacity: 0; pointer-events: none;
  }
  #lbBtn.on { opacity: 1; pointer-events: auto; }
  #lbBtn svg { width: 22px; height: 22px; }
  #lbBtn.pulse { animation: gs-pulse-gold 1.8s ease-in-out infinite; }
  @keyframes gs-pulse-gold { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,226,122,.55); } 50% { box-shadow: 0 0 0 10px rgba(255,226,122,0); } }
  .chips { display: flex; gap: 6px; margin: 0 0 10px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    border: 1px solid rgba(255,255,255,.18); background: none; color: rgba(255,255,255,.75); font: inherit; font-size: 13px; font-weight: 800; }
  .chips button[aria-pressed="true"] { border-color: rgba(255,226,122,.7); background: rgba(255,226,122,.12); color: #fff3c4; }
  .lbList { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; min-height: 120px; }
  .lbList li { display: grid; grid-template-columns: 40px 26px 1fr auto; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 12px; background: rgba(255,255,255,.04); font-size: 15px; }
  .lbList li.top1 { background: rgba(255,226,122,.14); } .lbList li.top2, .lbList li.top3 { background: rgba(255,255,255,.08); }
  .lbList li.me { outline: 1.5px solid rgba(127,232,255,.8); background: rgba(127,232,255,.1); }
  .lbList li.gap { background: none; padding: 0; min-height: 10px; }
  .lbList .rk { font-weight: 900; color: rgba(255,255,255,.7); }
  .lbList .nk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .lbList .sc { font-weight: 900; font-variant-numeric: tabular-nums; }
  .lbList .rep { grid-column: 1 / -1; justify-self: end; }
  .lbList .info { display: block; padding: 24px 8px; text-align: center; color: rgba(255,255,255,.6); background: none; font-size: 14px; }
  .lbForm { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .lbForm > * { min-width: 0; }
  .lbForm p.intro { margin: 0 4px 6px; font-size: 14px; color: rgba(255,255,255,.75); line-height: 1.4; }
  .lbForm label { font-size: 13px; font-weight: 800; color: rgba(255,255,255,.75); margin: 4px 4px 0; }
  .lbForm input, .lbForm select { height: 46px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06);
    width: 100%; box-sizing: border-box; color: #fff; font: inherit; font-size: 16px; padding: 0 12px; outline: none; }
  .lbForm select option { color: #000; }
  .lbForm input:focus, .lbForm select:focus { border-color: #7fe8ff; }
  .lbForm .cta { margin-top: 8px; }
  .lbLinks { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .lbLinks .link { margin: 0; }
  .lbLinks .danger { color: #ff8fa3; }

  /* ---------- How to play ---------- */
  #help {
    top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px);
    height: 44px; padding: 0 16px 0 6px; border-radius: 999px;
    display: flex; align-items: center; gap: 9px; font-size: 14px; letter-spacing: .02em;
    opacity: 0; pointer-events: none;
  }
  #help.on { opacity: 1; pointer-events: auto; }
  #help .q {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(127,232,255,.14); border: 1px solid rgba(127,232,255,.5);
    color: #bff3ff; font-weight: 900; font-size: 17px; line-height: 1;
  }
  #help.pulse .q { animation: gs-pulse 1.8s ease-in-out infinite; }
  .btn:focus-visible, #howto button:focus-visible { outline: 2px solid #7fe8ff; outline-offset: 3px; }
  @keyframes gs-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(127,232,255,.5); } 50% { box-shadow: 0 0 0 9px rgba(127,232,255,0); } }

  #howto {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; background: rgba(4,3,10,.74);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    animation: gs-fade .18s ease-out;
  }
  #howto .panel {
    position: relative; width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; box-sizing: border-box;
    padding: 24px 20px 20px; border-radius: 22px; color: #fff; touch-action: pan-y;
    background: linear-gradient(160deg, rgba(40,32,82,.97), rgba(12,10,28,.97));
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14);
    animation: gs-pop .24s cubic-bezier(.2,.9,.3,1.25);
  }
  #howto h2 { margin: 0 44px 18px 0; font-size: 22px; font-weight: 900; letter-spacing: .02em; text-wrap: balance; }
  #howto .close {
    position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff;
    font-family: inherit; font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  #howto .rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  #howto .rule { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; }
  #howto .rule svg { width: 48px; height: 48px; display: block; }
  #howto strong { display: block; font-size: 16px; font-weight: 800; }
  #howto p { margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: rgba(255,255,255,.72); }
  #howto .specials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  #howto .chip {
    display: grid; justify-items: center; gap: 2px; padding: 10px 4px; border-radius: 14px; text-align: center;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
  }
  #howto .chip svg { width: 40px; height: 40px; margin-bottom: 4px; }
  #howto .chip b { font-size: 13px; font-weight: 800; }
  #howto .chip span { font-size: 12px; line-height: 1.3; color: rgba(255,255,255,.66); }
  #howto .tip { margin: 18px 0 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: 13px; }
  #howto .cta {
    width: 100%; height: 50px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, #7fe8ff, #c58bff); color: #140d2c;
    font-family: inherit; font-weight: 800; font-size: 16px; line-height: 1; letter-spacing: .02em;
  }
  #howto .cta:active, #howto .close:active { transform: scale(.96); }
  @keyframes gs-fade { from { opacity: 0; } }
  @keyframes gs-pop { from { opacity: 0; transform: translateY(14px) scale(.94); } }
  @media (prefers-reduced-motion: reduce) { #help.pulse .q, #howto, #howto .panel { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="mute" class="btn" aria-label="Sound on/off"></button>
<button id="share" class="btn"></button>
<button id="revive" class="btn" type="button" hidden></button>
<button id="wallet" class="btn" type="button"><span class="gem" aria-hidden="true"></span><b id="walletN">0</b><span class="plus" aria-hidden="true">+</span></button>
<div id="shop" class="modal" role="dialog" aria-modal="true" aria-labelledby="shopTitle" hidden>
  <div class="panel">
    <button id="shopClose" class="close" type="button" aria-label="Close">×</button>
    <h2 id="shopTitle"></h2>
    <div class="bal"><span class="gem" aria-hidden="true"></span><b id="shopBal">0</b></div>
    <div class="tabs" role="tablist" id="shopTabs"></div>
    <div class="items" id="shopList"></div>
    <p class="msg" id="shopMsg" aria-live="polite"></p>
  </div>
</div>
<div id="daily" class="modal" role="dialog" aria-modal="true" aria-labelledby="dailyTitle" hidden>
  <div class="panel">
    <button id="dailyClose" class="close" type="button" aria-label="Close">×</button>
    <h2 id="dailyTitle"></h2>
    <p class="sub" id="dailySub"></p>
    <div class="days" id="dailyDays"></div>
    <button id="dailyClaim" class="cta" type="button"></button>
  </div>
</div>
<button id="lbBtn" class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#ffe27a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg></button>
<div id="lb" class="modal" role="dialog" aria-modal="true" aria-labelledby="lbTitle" hidden>
  <div class="panel">
    <button id="lbClose" class="close" type="button" aria-label="Close">×</button>
    <h2 id="lbTitle"></h2>
    <div id="lbBoard">
      <div class="chips" id="lbFields"></div>
      <div class="tabs" role="tablist" id="lbTabs"></div>
      <ol class="lbList" id="lbList"></ol>
      <div class="lbLinks"><button type="button" class="link" id="lbEdit"></button><button type="button" class="link danger" id="lbDelete"></button></div>
    </div>
    <form id="lbForm" class="lbForm" hidden>
      <p class="intro" id="lbIntro"></p>
      <label for="lbNick" id="lbNickL"></label>
      <input id="lbNick" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <label for="lbCountry" id="lbCountryL"></label>
      <select id="lbCountry"></select>
      <button class="cta" type="submit" id="lbSave"></button>
      <button type="button" class="link" id="lbCancel"></button>
      <p class="msg" id="lbMsg" aria-live="polite"></p>
      <div class="lbLinks" id="lbFormLinks"><span></span><button type="button" class="link danger" id="lbDelete2"></button></div>
    </form>
  </div>
</div>
<button id="help" class="btn" type="button"><span class="q" aria-hidden="true">?</span><span id="helpLabel"></span></button>
<div id="howto" role="dialog" aria-modal="true" aria-labelledby="howtoTitle" hidden>
  <div class="panel">
    <button id="howtoClose" class="close" type="button" aria-label="Close">×</button>
    <h2 id="howtoTitle"></h2>
    <ul class="rules">
      <li class="rule"><span data-icon="swipe"></span><div><strong data-t="r1t"></strong><p data-t="r1"></p></div></li>
      <li class="rule"><span data-icon="black"></span><div><strong data-t="r2t"></strong><p data-t="r2"></p></div></li>
      <li><strong data-t="r3t"></strong>
        <div class="specials">

/* =========================================================
   UPDATE
   ========================================================= */
function update(rdt) {
  // hit-stop freezes the world for a few frames: the "impact" feel
  let ts = 1;
  if (hitStop > 0) { hitStop -= rdt; ts = 0.06; }
  if (state === 'dying') ts *= 0.4;
  const dt = rdt * ts;
  stateT += rdt;

  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i]; tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }

  if (state === 'play') {
    elapsed += dt;
    const nl = levelFor(RF.timed ? levelStart(RF.startLevel) + (elapsed - levelStart(RF.startLevel)) * 2 : elapsed);
    if (nl !== level) {
      level = nl; levelHue = levelHueFor(level);
      showBanner(L.level + ' ' + level, '', 'hsl(' + levelHue + ',100%,78%)', 1.4);
      SFX.arp([noteFreq(0), noteFreq(2), noteFreq(4), noteFreq(5)], 0.08, 0.09);
    }
    spawnT -= dt * (slowT > 0 ? 0.5 : 1);
    if (spawnT <= 0) { spawn(); spawnT = spawnGap() * rand(0.8, 1.2); }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (feverT > 0) feverT -= dt;
    if (slowT > 0) slowT -= dt;
    if (RF.timed) { rushT -= dt; if (rushT <= 0) { rushT = 0; timeUp = true; endGame(); } }
    runSampleT += dt;
    if (runSampleT >= 5 && runSummary.length < 150) { runSampleT -= 5; runSummary.push([rankScore, broken, combo]); }
    if (RF.wind) { // storm: a steady sway plus strong gusts you can see coming
      nextGust -= dt;
      if (nextGust <= 0) {
        gustDir = Math.random() < 0.5 ? -1 : 1; gustT = 2.4; nextGust = rand(5, 9) * (level >= 6 ? 0.75 : 1);
        floatText((gustDir < 0 ? '← ' : '') + L.wind + (gustDir > 0 ? ' →' : ''), W / 2, H * 0.3, clamp(S * 0.05, 18, 30), '#9fd8ff', 1.3, 0);
        SFX.whoosh(0.8);
      }
      if (gustT > 0) gustT -= dt;
    }
  }
  const windT = RF.wind && state === 'play' ? Math.sin(elapsed * 0.45) * 0.22 + (gustT > 0 ? gustDir * Math.sin(Math.PI * gustT / 2.4) * 0.9 : 0) : 0;
  wind += (windT - wind) * Math.min(1, dt * 3);

  // objects
  const f = (slowT > 0 ? 0.42 : 1) * BALL.fallK, grav = H * 0.015, wpush = wind * S * 0.36;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (o.dead) { objs.splice(i, 1); continue; }
    o.t += dt;
    if (o.type === START) { o.rot += o.vr * dt; o.y = H * 0.56 + Math.sin(o.t * 1.6) * S * 0.012; continue; }
    if (state === 'dying') continue;
    o.vy += grav * dt * f;
    o.x += (o.vx + wpush + Math.cos(o.t * o.swayF + o.ph) * o.swayA * o.swayF) * dt * f;
    o.y += o.vy * dt * f;
    o.rot += o.vr * dt * f;
    const lo = FX + o.r * 0.6, hi = FX + FW - o.r * 0.6;
    if (o.x < lo) { o.x = lo; o.vx = Math.abs(o.vx); } else if (o.x > hi) { o.x = hi; o.vx = -Math.abs(o.vx); }
    if (o.type === GOLD && Math.random() < dt * 14) addSpark(o.x + rand(-o.r, o.r), o.y + rand(-o.r, o.r), 0, -S * 0.05, '#ffe9a0', 1.6, 0.5);
    if (state === 'play' && o.y > floorY - o.r * 0.35) hitFloor(o);
  }

  // shards
  const G = H * 1.7;
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.vy += G * dt; s.vx *= 1 - 0.5 * dt; s.vx += wpush * 1.4 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    if (s.y > floorY && s.vy > 0) { s.y = floorY; s.vy *= -0.32; s.vx *= 0.6; s.vr *= 0.5; }
    s.life -= dt;
    if (s.life <= 0 || s.x < -80 || s.x > W + 80) { shardFree.push(s); shards[i] = shards[shards.length - 1]; shards.pop(); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.vy += G * 0.45 * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.0 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { sparkFree.push(p); sparks[i] = sparks[sparks.length - 1]; sparks.pop(); }
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= rdt; t.y += t.vy * rdt; t.vy *= 1 - 2 * rdt; if (t.life <= 0) texts.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt; r.r += r.vr * dt * (r.life / r.max + 0.2); if (r.life <= 0) rings.splice(i, 1); }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].life -= dt; if (flashes[i].life <= 0) flashes.splice(i, 1); }
  for (let i = cracks.length - 1; i >= 0; i--) { cracks[i].life -= dt; if (cracks[i].life <= 0) cracks.splice(i, 1); }
  updateGems(rdt);
  updateOrb(rdt);
  for (let i = trail.length - 1; i >= 0; i--) { trail[i].t += rdt; }
  while (trail.length && trail[0].t > 0.14) trail.shift();
  for (const d of dust) {
    d.y -= S * 0.012 * d.z * rdt; d.x += wind * S * 0.9 * d.z * rdt;
    if (d.y < -4) { d.y = H + 4; d.x = rand(0, W); }
    if (d.x < -40) d.x += W + 80; else if (d.x > W + 40) d.x -= W + 80;
  }

  if (banner) { banner.life -= rdt; if (banner.life <= 0) banner = null; }
  trauma = Math.max(0, trauma - rdt * 1.9);
  redFlash = Math.max(0, redFlash - rdt * 2.2);
  goldFlash = Math.max(0, goldFlash - rdt * 1.4);
  scorePop = Math.max(0, scorePop - rdt * 5);
  gemPop = Math.max(0, gemPop - rdt * 4);
  walletShown += (save.crystals - walletShown) * Math.min(1, rdt * 8);
  if (Math.abs(save.crystals - walletShown) < 0.5) walletShown = save.crystals;
  syncWallet();
  shownScore += (score - shownScore) * Math.min(1, rdt * 14);
  if (Math.abs(score - shownScore) < 0.5) shownScore = score;
  const targetBg = feverT > 0 ? (bgHue + rdt * 90) : 225 + ((level - 1) % 4) * 20;
  bgHue = feverT > 0 ? targetBg % 360 : bgHue + (((targetBg - bgHue + 540) % 360) - 180) * Math.min(1, rdt * 1.5);

  if (state === 'dying' && stateT > 1.6) finishGame();
}

/* ---------- the ball: follows your finger, its weight shows in how loosely it follows ---------- */
function updateOrb(dt) {
  let p = null;
  for (const q of pointers.values()) { p = q; break; }
  const want = !!p && (state === 'play' || state === 'title') && !paused;
  if (want) {
    if (!orb.on && orb.a < 0.05) { orb.x = p.x; orb.y = p.y; }
    orb.on = true; orb.tx = p.x; orb.ty = p.y;
  } else orb.on = false;
  orb.a += ((orb.on ? 1 : 0) - orb.a) * Math.min(1, dt * 14);
  const f = 1 - Math.exp(-dt / Math.max(0.004, BALL.lag * 0.12));
  orb.vx = (orb.tx - orb.x) * f; orb.vy = (orb.ty - orb.y) * f;
  orb.x += orb.vx; orb.y += orb.vy;
  if (BALL.fire && orb.a > 0.3 && Math.random() < dt * 45)
    addSpark(orb.x + rand(-1, 1) * R * 0.15, orb.y + rand(-1, 1) * R * 0.15, rand(-1, 1) * S * 0.04, -S * rand(0.12, 0.3), 'hsl(' + randi(12, 45) + ',100%,62%)', rand(1.4, 2.6), rand(0.18, 0.36));
}
function drawOrb(now) {
  if (orb.a < 0.02) return;
  const r = R * BALL.r, x = orb.x, y = orb.y;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = orb.a * (BALL.hitK > 1.2 ? 0.9 : 0.55);
  const gl = r * (BALL.hitK > 1.2 ? 5 : 3.4);
  ctx.drawImage(glowSprite, x - gl, y - gl, gl * 2, gl * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = orb.a;
  const gr = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  gr.addColorStop(0, BALL.c1); gr.addColorStop(1, BALL.c2);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = gr; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
  if (BALL.heavy) { // marble veins
    ctx.strokeStyle = 'rgba(90,80,75,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - r * 0.6, y + r * 0.1); ctx.quadraticCurveTo(x, y - r * 0.4, x + r * 0.55, y + r * 0.3); ctx.stroke();
  }
  if (BALL.fallK < 1) { // frost: a small snowflake
    ctx.save(); ctx.translate(x, y); ctx.rotate(now * 0.0012);
    ctx.strokeStyle = 'rgba(235,250,255,' + (0.85 * orb.a) + ')'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75); }
    ctx.stroke(); ctx.restore();
  }
  if (BALL.perfK > 1 || BALL.ptsK > 1) { // star / crown: a turning four-point sparkle
    ctx.save(); ctx.translate(x, y); ctx.rotate(now * 0.003);
    const k = r * (1.7 + 0.2 * Math.sin(now * 0.01));
    ctx.fillStyle = BALL.ptsK > 1 ? 'rgba(255,226,122,' + (0.8 * orb.a) + ')' : 'rgba(240,210,255,' + (0.8 * orb.a) + ')';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? k * 0.18 : k; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (BALL.magnet) { // spinning field ring
    ctx.save(); ctx.translate(x, y); ctx.rotate(now * 0.004);
    ctx.setLineDash([r * 0.5, r * 0.4]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,140,170,' + (0.5 * orb.a) + ')';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.stroke(); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   RENDER
   ========================================================= */
function txt(str, x, y, size, col, opts) {
  opts = opts || {};
  ctx.font = (opts.w || 800) + ' ' + Math.round(size) + 'px ' + FONT;
  const fit = opts.fit === undefined ? W - 28 : opts.fit;
  if (fit) { const w = ctx.measureText(str).width; if (w > fit) { size *= fit / w; ctx.font = (opts.w || 800) + ' ' + Math.round(size) + 'px ' + FONT; } }
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  if (opts.outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.14); ctx.strokeStyle = opts.outline; ctx.strokeText(str, x, y); }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function polyPath(p, k) {
  ctx.beginPath(); ctx.moveTo(p[0] * k, p[1] * k);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * k, p[i + 1] * k);
  ctx.closePath();
}
function drawGlass(o, sx, sy, now) {
  const c = Math.cos(o.rot), s = Math.sin(o.rot);
  ctx.setTransform(DPR * c, DPR * s, -DPR * s, DPR * c, DPR * (o.x + sx), DPR * (o.y + sy));
  const fever = feverT > 0 && o.type === GLASS;
  polyPath(o.pts, 1);
  ctx.fillStyle = o.fill; ctx.fill();
  ctx.lineJoin = 'round';
  if (o.type === PRISM) {
    const p = o.pts, n = p.length >> 1;
    ctx.lineWidth = o.lw;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      ctx.strokeStyle = 'hsl(' + ((now * 0.25 + i * 60) % 360) + ',100%,72%)';
      ctx.beginPath(); ctx.moveTo(p[i * 2], p[i * 2 + 1]); ctx.lineTo(p[j * 2], p[j * 2 + 1]); ctx.stroke();
    }
  } else {
    ctx.lineWidth = o.lw * (fever ? 1.4 : 1); ctx.strokeStyle = fever ? 'hsl(' + ((now * 0.2 + o.hue) % 360) + ',100%,80%)' : o.edge; ctx.stroke();
  }
  // danger pulse near the floor
  if (state === 'play' && (o.type === GLASS || o.type === TEMPERED) && o.y > H * 0.7) {
    const k = clamp((o.y - H * 0.7) / (floorY - H * 0.7), 0, 1);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,60,90,' + (k * (0.55 + 0.45 * Math.sin(now * 0.025))) + ')'; ctx.stroke();
  }
  polyPath(o.pts, 0.78); ctx.lineWidth = 1.2; ctx.strokeStyle = o.bevel; ctx.stroke();
  if (o.crk) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4; ctx.beginPath();
    for (let i = 0; i < o.crk.length; i += 6) { ctx.moveTo(o.crk[i], o.crk[i + 1]); ctx.lineTo(o.crk[i + 2], o.crk[i + 3]); ctx.lineTo(o.crk[i + 4], o.crk[i + 5]); }
    ctx.stroke();
  }
  if (o.type === OBSIDIAN) { // a menacing inner eye
    ctx.fillStyle = 'hsla(300,100%,70%,' + (0.35 + 0.25 * Math.sin(now * 0.008 + o.ph)) + ')';
    ctx.beginPath(); ctx.arc(0, 0, o.r * 0.16, 0, TAU); ctx.fill();
  }
  if (o.type === HEART) txt('♥', 0, 0, o.r * 0.7, 'rgba(255,255,255,0.85)', { fit: 0 });
  // world-aligned specular streak (light from the top-left)
  ctx.setTransform(DPR, 0, 0, DPR, DPR * (o.x + sx), DPR * (o.y + sy));
  ctx.lineCap = 'round';
  const r = o.r;
  ctx.strokeStyle = o.type === OBSIDIAN ? 'rgba(220,180,255,0.35)' : 'rgba(255,255,255,0.55)';
  ctx.lineWidth = Math.max(2, r * 0.075);
  ctx.beginPath(); ctx.moveTo(-r * 0.36, r * 0.02); ctx.lineTo(-r * 0.02, -r * 0.34); ctx.stroke();
  ctx.lineWidth = Math.max(1.2, r * 0.04);
  ctx.beginPath(); ctx.moveTo(-r * 0.2, r * 0.14); ctx.lineTo(r * 0.1, -r * 0.16); ctx.stroke();
}

function render(now) {
  const sh = trauma * trauma * S * 0.035;
  const sx = sh ? rand(-sh, sh) : 0, sy = sh ? rand(-sh, sh) : 0;

  // background
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const bgc = THEME.bg(bgHue, feverT > 0);
  g.addColorStop(0, bgc[0]);
  g.addColorStop(1, bgc[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft overhead light
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.10 + (feverT > 0 ? 0.08 + 0.06 * Math.sin(now * 0.01) : 0);
  ctx.drawImage(glowSprite, W / 2 - S * 0.9, -S * 0.75, S * 1.8, S * 1.5);
  // dust
  ctx.globalAlpha = 1;
  ctx.fillStyle = THEME.dust;
  for (const d of dust) {
    const a = 0.25 + 0.25 * Math.sin(now * 0.002 + d.p);
    ctx.globalAlpha = a * d.z; const z = 1 + d.z * 1.4;
    if (Math.abs(wind) > 0.12) ctx.fillRect(d.x, d.y, -wind * 40 * d.z, Math.max(1, z * 0.6)); // wind streaks
    else ctx.fillRect(d.x, d.y, z, z);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // play field edges on wide screens
  if (FX > 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, FX, H); ctx.fillRect(FX + FW, 0, W - FX - FW, H);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(FX - 1, 0, 1, H); ctx.fillRect(FX + FW, 0, 1, H);
  }
  // floor line
  if (state === 'play' || state === 'dying') {
    const fg = ctx.createLinearGradient(0, floorY - 30, 0, floorY);
    fg.addColorStop(0, 'rgba(255,255,255,0)'); fg.addColorStop(1, 'rgba(255,255,255,0.07)');
    ctx.fillStyle = fg; ctx.fillRect(FX, floorY - 30, FW, 30);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(FX, floorY, FW, 1);
  }

  // glass objects
  for (const o of objs) drawGlass(o, sx, sy, now);

  // shards
  ctx.lineJoin = 'round'; ctx.lineWidth = 1.2;
  for (const s of shards) {
    const c = Math.cos(s.rot), n = Math.sin(s.rot), v = s.v;
    ctx.setTransform(DPR * c, DPR * n, -DPR * n, DPR * c, DPR * (s.x + sx), DPR * (s.y + sy));
    ctx.globalAlpha = s.life < 0.35 ? s.life / 0.35 : 1;
    ctx.beginPath(); ctx.moveTo(v[0], v[1]);
    for (let k = 1; k < s.n; k++) ctx.lineTo(v[k * 2], v[k * 2 + 1]);
    ctx.closePath();
    ctx.fillStyle = s.fill; ctx.fill();
    ctx.strokeStyle = Math.sin(s.rot * 3) > 0.9 ? '#ffffff' : s.edge; // glint as it tumbles
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // additive layer: cracks, sparks, flashes, rings, trail
  ctx.setTransform(DPR, 0, 0, DPR, DPR * sx, DPR * sy);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const cr of cracks) {
    ctx.globalAlpha = cr.life / cr.max; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < cr.seg.length; i += 6) { ctx.moveTo(cr.seg[i], cr.seg[i + 1]); ctx.lineTo(cr.seg[i + 2], cr.seg[i + 3]); ctx.lineTo(cr.seg[i + 4], cr.seg[i + 5]); }
    ctx.stroke();
  }
  for (const p of sparks) {
    ctx.globalAlpha = p.life / p.max; ctx.strokeStyle = p.col; ctx.lineWidth = p.w;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
  }
  for (const fl of flashes) {
    const k = fl.life / fl.max; ctx.globalAlpha = k * 0.9; const r = fl.r * (1.2 - k * 0.4);
    ctx.drawImage(glowSprite, fl.x - r, fl.y - r, r * 2, r * 2);
  }
  for (const r of rings) {
    const k = r.life / r.max; ctx.globalAlpha = 1; ctx.strokeStyle = r.col + (k * 0.8).toFixed(3) + ')'; ctx.lineWidth = r.w * k + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  // finger trail
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    if (a.s !== b.s) continue;
    const k = 1 - b.t / 0.14;
    ctx.globalAlpha = k * 0.9; ctx.lineWidth = 2 + k * (R * 0.22) * (BALL.hitK > 1.2 ? 1.5 : 1);
    ctx.strokeStyle = feverT > 0 ? 'hsl(' + ((now * 0.3 + i * 12) % 360) + ',100%,75%)' : THEME.trail ? THEME.trail(i) : 'hsl(' + levelHue + ',100%,85%)';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawOrb(now);
  // crystals
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const g of gems) {
    const blink = g.rest > 1.1 ? (Math.sin(now * 0.04) > 0 ? 1 : 0.25) : 1;
    drawGem(g.x, g.y, R * (g.fly ? 0.2 : 0.26), g.rot, blink);
  }
  ctx.globalAlpha = 1;

  // vignettes
  ctx.drawImage(vigDark, 0, 0, W, H);
  if (redFlash > 0) { ctx.globalAlpha = redFlash; ctx.drawImage(vigRed, 0, 0, W, H); }
  if (state === 'play' && (RF.timed ? rushT < 10 : lives === 1)) { ctx.globalAlpha = 0.18 + 0.12 * Math.sin(now * 0.006); ctx.drawImage(vigRed, 0, 0, W, H); }
  if (goldFlash > 0 || feverT > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(goldFlash * 0.8, feverT > 0 ? 0.25 + 0.15 * Math.sin(now * 0.012) : 0);
    ctx.drawImage(vigGold, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (slowT > 0 && state === 'play') { ctx.globalAlpha = Math.min(1, slowT) * 0.12; ctx.fillStyle = '#9fd8ff'; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;

  // floating texts
  for (const t of texts) {
    const k = t.life / t.max, pop = 1 + Math.max(0, (k - 0.82) / 0.18) * 0.5;
    ctx.globalAlpha = Math.min(1, k * 2.5);
    txt(t.txt, t.x, t.y, t.size * pop, t.col, { outline: 'rgba(0,0,0,0.45)' });
  }
  ctx.globalAlpha = 1;

  if (state === 'play' || state === 'dying') drawHUD(now);
  if (state === 'title') drawTitle(now);
  if (state === 'over') drawOver(now);
  if (banner) {
    const k = banner.life / banner.max, age = banner.max - banner.life;
    const sc = age < 0.15 ? 1.6 - age / 0.15 * 0.6 : 1;
    ctx.globalAlpha = Math.min(1, k * 3);
    const bs = clamp(S * 0.11, 34, 76) * sc;
    txt(banner.txt, W / 2, H * 0.44, bs, banner.col, { outline: 'rgba(0,0,0,0.5)', w: 900 });
    if (banner.sub) txt(banner.sub, W / 2, H * 0.44 + bs * 0.85, bs * 0.38, '#ffffff', { outline: 'rgba(0,0,0,0.5)' });
    ctx.globalAlpha = 1;
  }
  if (paused) {
    ctx.fillStyle = 'rgba(5,4,12,0.72)'; ctx.fillRect(0, 0, W, H);
    txt(L.paused, W / 2, H * 0.45, clamp(S * 0.1, 32, 64), '#fff', { w: 900 });
    txt(L.resume, W / 2, H * 0.53, clamp(S * 0.04, 15, 22), 'rgba(255,255,255,0.75)', { w: 600 });
  }
}

function drawLives(x, y, size) {
  if (RF.timed) { // time rush: the clock replaces the hearts
    const low = rushT < 10;
    txt('◷ ' + Math.ceil(rushT), x - size * 0.4, y, size * 1.25 * (low ? 1 + 0.08 * Math.sin(performance.now() * 0.02) : 1), low ? '#ff5a7a' : '#7dffcf', { align: 'left', w: 900, outline: 'rgba(0,0,0,0.35)', fit: 0 });
    return;
  }
  if (shieldOn) { // shield boost: a little shield after the hearts
    const sx = x + maxLives * size * 1.25 + size * 0.1, s = size * 0.55;
    ctx.beginPath(); ctx.moveTo(sx, y - s); ctx.lineTo(sx + s * 0.85, y - s * 0.62); ctx.lineTo(sx + s * 0.7, y + s * 0.35);
    ctx.lineTo(sx, y + s); ctx.lineTo(sx - s * 0.7, y + s * 0.35); ctx.lineTo(sx - s * 0.85, y - s * 0.62); ctx.closePath();
    ctx.fillStyle = 'rgba(160,215,255,0.35)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#cfeaff'; ctx.stroke();
  }
  for (let i = 0; i < maxLives; i++) {
    const cx = x + i * size * 1.25, on = i < lives;
    ctx.beginPath(); ctx.moveTo(cx, y - size * 0.5); ctx.lineTo(cx + size * 0.42, y); ctx.lineTo(cx, y + size * 0.5); ctx.lineTo(cx - size * 0.42, y); ctx.closePath();
    ctx.fillStyle = on ? 'rgba(255,120,160,0.55)' : 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = on ? '#ffc2d6' : 'rgba(255,255,255,0.2)'; ctx.stroke();
  }
}
function drawHUD(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = safeT + 14;
  // progress towards your best (the "almost there" hook)
  if (prevBest > 0) {
    const k = clamp(score / prevBest, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, safeT, W, 3);
    ctx.fillStyle = score > prevBest ? '#ffe27a' : 'hsl(' + levelHue + ',100%,75%)'; ctx.fillRect(0, safeT, W * k, 3);
  }
  const ss = clamp(S * 0.1, 34, 66) * (1 + scorePop * 0.18);
  txt(String(Math.round(shownScore)), W / 2, top + ss * 0.6, ss, '#fff', { w: 900, outline: 'rgba(0,0,0,0.35)' });
  const small = clamp(S * 0.034, 12, 18);
  if (prevBest > 0) txt(score > prevBest ? L.newBest : L.best + ' ' + prevBest, W / 2, top + ss * 1.25, small, score > prevBest ? '#ffe27a' : 'rgba(255,255,255,0.55)', { w: 700 });
  // combo multiplier with draining timer
  if (combo >= 2) {
    const mult = Math.min(8, 1 + Math.floor(combo / 5)) * (feverT > 0 ? 2 : 1);
    const cy = top + ss * 1.25 + small * 1.7;
    const hue = (combo * 9) % 360;
    txt('×' + mult + '  ·  ' + combo + ' ' + L.combo, W / 2, cy, small * 1.15, 'hsl(' + hue + ',100%,75%)', { w: 800 });
    const bw = clamp(S * 0.28, 90, 180), k = clamp(comboT / COMBO_WIN, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(W / 2 - bw / 2, cy + small * 0.9, bw, 3);
    ctx.fillStyle = 'hsl(' + hue + ',100%,70%)'; ctx.fillRect(W / 2 - bw / 2, cy + small * 0.9, bw * k, 3);
  }
  const ls = clamp(S * 0.045, 16, 24);
  drawLives(safeT ? 22 + ls * 0.4 : 18 + ls * 0.4, top + ls * 0.6, ls);
  txt(L.level + ' ' + level, 16, top + ls * 1.75, small * 0.85, 'rgba(255,255,255,0.5)', { align: 'left', w: 700 });
  // crystals collected so far (total wallet), with a pop when one lands
  const gsz = small * (1 + gemPop * 0.35), gy = safeT + 84, label = String(Math.round(walletShown));
  ctx.font = '900 ' + Math.round(gsz) + 'px ' + FONT;
  const tw = ctx.measureText(label).width; gemHudW = tw + gsz * 1.3;
  txt(label, W - 16, gy, gsz, '#dffbff', { align: 'right', w: 900, outline: 'rgba(0,0,0,0.35)' });
  drawGem(W - 16 - tw - gsz * 0.65, gy, gsz * 0.5, 0, 1);
  if (feverT > 0) txt(L.fever, W - 16, gy + small * 1.6, small, '#ffe27a', { align: 'right', w: 900 });
}

function drawTitle(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ts = clamp(S * 0.15, 44, 110);
  const y0 = Math.max(safeT + ts * 0.9, H * 0.17);
  const gr = ctx.createLinearGradient(W / 2 - ts * 2.5, 0, W / 2 + ts * 2.5, 0);
  const h = (now * 0.03) % 360;
  gr.addColorStop(0, 'hsl(' + h + ',100%,80%)'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, 'hsl(' + ((h + 120) % 360) + ',100%,80%)');
  txt('GLASS', W / 2, y0, ts, gr, { w: 900, outline: 'rgba(0,0,0,0.35)' });
  txt('SYMPHONY', W / 2, y0 + ts * 0.82, ts * 0.52, 'rgba(255,255,255,0.9)', { w: 300 });
  if (startPane && !startPane.dead) {
    const pulse = 1 + 0.06 * Math.sin(now * 0.006);
    txt(L.tap, startPane.x, startPane.y, clamp(S * 0.06, 20, 38) * pulse, '#ffffff', { w: 900, outline: 'rgba(0,0,0,0.3)', fit: startPane.r * 1.45 });
  }
  const hs = clamp(S * 0.036, 13, 19), hy = Math.min(H * 0.8, H - safeB - hs * 7);
  txt(L.hint1, W / 2, hy, hs, 'rgba(255,255,255,0.8)', { w: 600 });
  txt('⬢  ' + L.hint2, W / 2, hy + hs * 1.7, hs, '#c58bff', { w: 700 });
  const fb = bestFor(fieldId);
  if (fb > 0 || topBest() > 0) txt(L.best + ' ' + fb + '   ·   ' + L.rank + ': ' + L.ranks[rankIndex(topBest())], W / 2, hy + hs * 3.6, hs * 0.95, '#ffe27a', { w: 700 });
  const nr = nextRunText();
  if (nr) txt(nr, W / 2, hy + hs * 5.3, hs * 0.9, FIELD.col, { w: 800 });
}
// "Field: Storm · Shield, Extra heart" when the next run is not a plain classic one
function nextRunText() {
  const on = save.armed.filter(id => BOOSTS[id] && save.boosts[id] > 0).map(id => L.boosts[id][0]);
  if (fieldId === 'classic' && !on.length) return '';
  return L.fields[fieldId][0] + (on.length ? '  ·  ' + on.join(', ') : '');
}

// the leaderboard line on the game-over screen
let rankLineY = 0; // where the leaderboard line was drawn: tapping "add a nickname" opens the form
function rankText() {
  const r = lastRank;
  if (!r) return null;
  if (r.status === 'accepted') {
    if (NET.me && !NET.me.nickname) return [L.rankNick + '  ›', '#ffe27a'];
    return [L.rankLine(r.world, r.country, NET.me && NET.me.country ? countryName(NET.me.country) : '', r.week), '#ffe27a'];
  }
  const m = { wait: L.rankWait, review: L.rankReview, rejected: L.rankRejected, boost: L.rankBoost, offline: L.rankOffline }[r.status];
  return m ? [m, 'rgba(255,255,255,0.6)'] : null;
}
function drawOver(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const a = clamp(stateT / 0.4, 0, 1);
  ctx.globalAlpha = a * 0.6; ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const u = clamp(S * 0.1, 30, 70);
  let y = Math.max(safeT + u * 0.9, H * 0.16);
  txt(timeUp ? L.timeUp : rfId !== 'classic' ? L.fields[rfId][0].toUpperCase() : L.over, W / 2, y, u * 0.48, rfId !== 'classic' ? RF.col : 'rgba(255,255,255,0.75)', { w: 800 });
  y += u * 1.25;
  const pop = stateT < 0.5 ? 1 + (1 - stateT / 0.5) * 0.25 : 1;
  txt(String(score), W / 2, y, u * 1.6 * pop, newBest ? '#ffe27a' : '#ffffff', { w: 900, outline: 'rgba(0,0,0,0.4)' });
  y += u * 1.15;
  const s2 = u * 0.36;
  if (newBest && score > 0) {
    txt(L.newBest, W / 2, y, s2 * (1 + 0.08 * Math.sin(now * 0.01)), '#ffe27a', { w: 900 });
  } else {
    const fb = bestFor(rfId), gap = fb - score;
    if (gap > 0 && gap <= Math.max(150, fb * 0.3)) txt(L.toBeat(gap), W / 2, y, s2 * 0.9, '#ffb36b', { w: 800 });
    else txt(L.best + ' ' + fb, W / 2, y, s2 * 0.9, 'rgba(255,255,255,0.7)', { w: 700 });
  }
  y += u * 0.75;
  txt(L.maxCombo + ' ' + maxCombo + '   ·   ' + L.shattered + ' ' + broken, W / 2, y, s2 * 0.75, 'rgba(255,255,255,0.6)', { w: 600 });
  if (runGems + runBonus > 0) {
    y += u * 0.62;
    txt('◆ +' + (runGems + runBonus) + (runBonus ? '   (' + L.bonus + ' +' + runBonus + ')' : ''), W / 2, y, s2 * 0.85, '#7fe8ff', { w: 800 });
  }
  const rl = rankText();
  rankLineY = 0;
  if (rl) { y += u * 0.62; txt(rl[0], W / 2, y, s2 * 0.8, rl[1], { w: 800 }); rankLineY = y; }
  // rank + progress to next rank (the long-term hook)
  y += u * 0.95;
  const tb = topBest(), ri = rankIndex(tb);
  txt(L.rank + ': ' + L.ranks[ri], W / 2, y, s2 * 0.95, 'hsl(' + (190 + ri * 30) + ',100%,78%)', { w: 900 });
  y += u * 0.5;
  const bw = Math.min(W * 0.7, 320);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(W / 2 - bw / 2, y, bw, 6);
  if (ri + 1 < RANK_AT.length) {
    const k = clamp((tb - RANK_AT[ri]) / (RANK_AT[ri + 1] - RANK_AT[ri]), 0, 1);
    ctx.fillStyle = 'hsl(' + (190 + ri * 30) + ',100%,70%)'; ctx.fillRect(W / 2 - bw / 2, y, bw * k, 6);
    txt(L.next + ': ' + L.ranks[ri + 1] + ' (' + RANK_AT[ri + 1] + ')', W / 2, y + u * 0.42, s2 * 0.7, 'rgba(255,255,255,0.55)', { w: 600 });
  } else {
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(W / 2 - bw / 2, y, bw, 6);
    txt(L.top, W / 2, y + u * 0.42, s2 * 0.7, '#ffe27a', { w: 800 });
  }
  if (stateT > 0.9) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now * 0.006);
    const ay = Math.min(H * 0.8, H - safeB - 100);
    txt(L.again, W / 2, ay, clamp(S * 0.05, 18, 28), '#ffffff', { w: 800 });
    const nr = nextRunText();
    if (nr) { ctx.globalAlpha = 1; txt(L.nextRun + ': ' + nr, W / 2, ay + clamp(S * 0.05, 18, 28) * 1.3, clamp(S * 0.033, 12, 17), FIELD.col, { w: 700 }); }
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   MAIN LOOP  (+ adaptive resolution to hold 60 FPS)
   ========================================================= */
let lastT = 0, perfAcc = 0, perfN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = lastT ? (now - lastT) / 1000 : 1 / 60;
  lastT = now;
  if (rdt > 0.05) rdt = 0.05; // tab hiccups never teleport glass through the floor
  if (!paused) update(rdt);
  render(now);
  if (state === 'play' && !paused) {
    perfAcc += rdt; perfN++;
    if (perfN >= 150) {
      const avg = perfAcc / perfN;
      if (avg > 0.022 && (dprCap > 1 || quality > 0.55)) {
        if (dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); resize(); } else quality = Math.max(0.55, quality - 0.2);
      }
      perfAcc = 0; perfN = 0;
    }
  }
}

resize();
toTitle();
requestAnimationFrame(frame);

// offline support: cache the game once, play anywhere without a connection
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !TEST && !ADS) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

if (TEST) {
  window.GS = {
    get state() { return state; }, get score() { return score; }, get lives() { return lives; },
    get objs() { return objs; }, get shards() { return shards.length; }, get level() { return level; },
    setElapsed(t) { elapsed = t; },
    put(type, x, y) { const o = createGlass(type, x, y, 0); objs.push(o); return objs.length; },
    setCombo(c) { combo = c; comboT = COMBO_WIN; },
    get gems() { return gems.length; }, get runGems() { return runGems; }, get runBonus() { return runBonus; },
    get ball() { return save.ball; }, get theme() { return save.theme; }, get crystals() { return save.crystals; },
    addCrystals(n) { save.crystals += n; persist(); },
    dropGem(x, y) { spawnGem(x, y, false); },
    gemPos() { return gems.map(g => [g.x, g.y, g.fly]); },
    grant: grantPurchase, openShop, openDaily, equip,
    get field() { return rfId; }, get rushT() { return rushT; }, get shield() { return shieldOn; },
    get maxLives() { return maxLives; }, get wind() { return wind; }, get boosts() { return save.boosts; },
    get armed() { return save.armed; }, get paused() { return paused; }, set paused(v) { paused = v; },
    bestFor, get lastRank() { return lastRank; }, get rankScore() { return rankScore; }, get runId() { return runId; }, net: NET
  };
}
})();
</script>
